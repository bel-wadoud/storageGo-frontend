services:
  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "3000:3000"
    environment:
      NUXT_PUBLIC_I18N_BASE_URL: http://localhost:3000
      # Until the Go API and the crypto core exist, the dev server uses stand-ins for both.
      NUXT_PUBLIC_DEV_MOCKS: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.nuxt
    restart: unless-stopped
