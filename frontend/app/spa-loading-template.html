<!-- Shown while a client-rendered page (e.g. signup steps) starts. Never a blank screen. -->
<div class="sg-boot" role="progressbar" aria-label="Loading"><i></i></div>
<style>
  .sg-boot {
    position: fixed;
    inset: 0 0 auto;
    height: 2px;
    overflow: hidden;
    background: var(--surface-3, #e6e3dc);
  }
  .sg-boot i {
    display: block;
    width: 30%;
    height: 100%;
    background: var(--signal, #f0a73a);
    animation: sg-boot 1.1s ease-in-out infinite;
  }
  @keyframes sg-boot {
    from { transform: translateX(-100%); }
    to { transform: translateX(340%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .sg-boot i { animation: none; width: 60%; }
  }
</style>
